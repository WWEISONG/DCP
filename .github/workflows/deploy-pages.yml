name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy in flight at a time. If a new push arrives during a
# deploy, cancel the in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: demo/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # REACT_APP_API_URL must be set as a repository variable (Settings → Secrets
        # and variables → Actions → Variables) to the public HTTPS URL of the
        # backend (e.g. https://dcp-backend.example.unsw.edu.au). If unset, the
        # built site will try http://localhost:8000 and the demo tabs will fail
        # for anyone but you.
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          CI: false
        run: npm run build

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
